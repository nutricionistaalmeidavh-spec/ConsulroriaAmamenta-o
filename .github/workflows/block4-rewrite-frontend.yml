name: Block 4 frontend rewrite

on:
  push:
    branches:
      - fix/block-4-frontend-cloudflare-only

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/block-4-frontend-cloudflare-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite retired Supabase literals to Cloudflare origin
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const legacyUrl = 'https://zxowxdfhtksevhnjmeyu.supabase.co';
          const legacyKey = 'sb_publishable_yXYUcXiks3Usr1GxHMw2Mg_cPMLD3zt';
          const allowed = new Set(['src/cloudflare-fetch-bridge.js']);
          const extensions = new Set(['.js', '.mjs']);
          const changed = [];

          function writeIfChanged(file, source, next) {
            if (next === source) return;
            fs.writeFileSync(file, next);
            changed.push(file.split(path.sep).join('/'));
          }

          function walk(root) {
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              const repoPath = full.split(path.sep).join('/');
              if (allowed.has(repoPath) || !extensions.has(path.extname(entry.name))) continue;
              const source = fs.readFileSync(full, 'utf8');
              const next = source
                .replaceAll(`'${legacyUrl}'`, 'window.location.origin')
                .replaceAll(`"${legacyUrl}"`, 'window.location.origin')
                .replaceAll(`'${legacyKey}'`, "'cloudflare-runtime'")
                .replaceAll(`"${legacyKey}"`, '"cloudflare-runtime"');
              writeIfChanged(full, source, next);
            }
          }

          walk('public');
          walk('src');

          // These modules are imported directly by Node contract tests. Keep the browser
          // origin same-origin without requiring the `window` global during module import.
          for (const file of [
            'public/feeding-assessment-history-feature.js',
            'public/clinical-care-flow-feature.js',
          ]) {
            const source = fs.readFileSync(file, 'utf8');
            const next = source.replaceAll('window.location.origin', "(globalThis.location?.origin || '')");
            writeIfChanged(file, source, next);
          }

          // The clinical source materializer starts from historical release archives.
          // Persist clean feature overlays so a later materialization cannot restore the retired host/key.
          const overlays = [
            'features/clinical-note-feature.js',
            'features/patient-fixes.js',
          ];
          for (const rel of overlays) {
            const source = path.join('public', 'clinical-source', rel);
            const target = path.join('patch-source', 'cloudflare-license-authority', rel);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            const before = fs.existsSync(target) ? fs.readFileSync(target, 'utf8') : '';
            const next = fs.readFileSync(source, 'utf8');
            writeIfChanged(target, before, next);
          }

          const materializerPath = 'scripts/materialize-clinical-source.mjs';
          let materializer = fs.readFileSync(materializerPath, 'utf8');
          const marker = "overlay('core/lib/repositories.js');";
          const replacement = `${marker}\noverlay('features/clinical-note-feature.js');\noverlay('features/patient-fixes.js');`;
          if (!materializer.includes("overlay('features/clinical-note-feature.js');")) {
            if (!materializer.includes(marker)) throw new Error('Materializer overlay marker not found.');
            const next = materializer.replace(marker, replacement);
            writeIfChanged(materializerPath, materializer, next);
          }

          // The canonical Cloudflare overlay, not the archived base config, is the source of truth.
          const guardPath = 'tests/clinical-source-block-4-frontend.test.mjs';
          const guard = fs.readFileSync(guardPath, 'utf8');
          let guardNext = guard.replace(
            "resolve(root, 'patch-source/base/config.js')",
            "resolve(root, 'patch-source/cloudflare-license-authority/config.js')",
          );
          guardNext = guardNext.replace(
            "    assert.match(source, /window\\.location\\.origin|location\\.origin|^\\s*const\\s+\\w+_ORIGIN\\s*=\\s*['\"]['\"]/m, `${path} must use current-origin Cloudflare routing`);\n",
            '',
          );
          writeIfChanged(guardPath, guard, guardNext);

          console.log(`Rewritten ${changed.length} path(s):`);
          for (const item of [...new Set(changed)].sort()) console.log(`- ${item}`);
          NODE
      - name: Validate rewritten JavaScript
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only -- '*.js' '*.mjs' | while read -r file; do
            [ -z "$file" ] && continue
            node --check "$file"
          done
      - name: Commit rewrite
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rewrite changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src patch-source/cloudflare-license-authority scripts/materialize-clinical-source.mjs tests/clinical-source-block-4-frontend.test.mjs
          git commit -m "fix: finish Block 4 frontend cutover guardrails"
          git push origin HEAD:fix/block-4-frontend-cloudflare-only
