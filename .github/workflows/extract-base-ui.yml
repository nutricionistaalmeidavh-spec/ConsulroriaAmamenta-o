name: Extract legacy patch source

on:
  push:
    branches:
      - improvements-v2
    paths:
      - '.github/workflows/extract-base-ui.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release patch
        shell: bash
        run: |
          set -euo pipefail
          cat public/release-1.11.0-patch-1.txt public/release-1.11.0-patch-2.txt public/release-1.11.0-patch-3.txt public/release-1.11.0-patch-4.txt public/release-1.11.0-patch-5.txt public/release-1.11.0-patch-6.txt public/release-1.11.0-patch-7.txt public/release-1.11.0-patch-8.txt | tr -d '\r\n' | base64 --decode > /tmp/release.zip
          unzip -t /tmp/release.zip
          rm -rf /tmp/release
          mkdir -p /tmp/release patch-source/release
          unzip -q /tmp/release.zip -d /tmp/release
          find /tmp/release -type f | sed 's#/tmp/release/##' | sort > patch-source/release/FILES.txt
          grep -RIlE 'DeboraBilling|Individual|Plano|Pacote|package|billing|payment' /tmp/release --include='*.js' --include='*.html' --include='*.css' | sed 's#/tmp/release/##' | sort > patch-source/release/BILLING_MATCHES.txt || true
          while IFS= read -r f; do
            case "$f" in
              *.js|*.html|*.css) mkdir -p "patch-source/release/$(dirname "$f")"; cp "/tmp/release/$f" "patch-source/release/$f" ;;
            esac
          done < patch-source/release/BILLING_MATCHES.txt
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git add patch-source/release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: extract legacy billing source for phase 6"
          git push
