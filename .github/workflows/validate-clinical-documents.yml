name: Validate clinical documents phase 0-8

on:
  push:
    branches:
      - feature/clinical-documents-phase-0-2
      - feature/clinical-documents-phase-3-5
      - feature/clinical-documents-phase-6-8
    paths:
      - 'public/phase02-loader.js'
      - 'public/documents-feature.js'
      - 'public/documents-feature.css'
      - 'public/document-pdf-service.js'
      - 'public/terms-feature.js'
      - 'public/phase35-loader.js'
      - 'public/album-feature.js'
      - 'public/album-feature.css'
      - 'public/referral-templates.js'
      - 'public/referrals-feature.js'
      - 'public/referrals-feature.css'
      - 'public/phase68-loader.js'
      - 'public/referral-finalization.js'
      - 'public/record-export-feature.js'
      - 'public/record-export-feature.css'
      - 'public/patient-records-hub.js'
      - 'public/patient-records-hub.css'
      - 'public/patient-workspace.js'
      - 'public/patient-workspace.css'
      - 'supabase/phase-clinical-documents-terms.sql'
      - 'supabase/phase-clinical-media-referrals.sql'
      - 'docs/PHASE_0_2_CLINICAL_DOCUMENTS.md'
      - 'docs/PHASE_3_5_CLINICAL_DOCUMENTS.md'
      - 'docs/PHASE_6_8_CLINICAL_DOCUMENTS.md'
      - 'tests/phase35-contracts.test.mjs'
      - 'tests/phase68-contracts.test.mjs'
      - 'index.html'
      - '.github/workflows/validate-clinical-documents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify phase 0-8 JS syntax
        run: |
          node --check public/phase02-loader.js
          node --check public/documents-feature.js
          node --check public/document-pdf-service.js
          node --check public/terms-feature.js
          node --check public/phase35-loader.js
          node --check public/album-feature.js
          node --check public/referral-templates.js
          node --check public/referrals-feature.js
          if [ -f public/phase68-loader.js ]; then node --check public/phase68-loader.js; fi
          if [ -f public/referral-finalization.js ]; then node --check public/referral-finalization.js; fi
          if [ -f public/record-export-feature.js ]; then node --check public/record-export-feature.js; fi
          if [ -f public/patient-workspace.js ]; then node --check public/patient-workspace.js; fi
          if [ -f public/patient-records-hub.js ]; then node --check public/patient-records-hub.js; fi

      - name: Run phase 3-5 contract tests
        run: node --test tests/phase35-contracts.test.mjs

      - name: Run phase 6-8 contract tests
        run: node --test tests/phase68-contracts.test.mjs

      - name: Verify clinical identity and consent contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "clinical_documents" public/documents-feature.js
          grep -q "consents?mother_id" public/documents-feature.js
          grep -q "source_consent_id" public/terms-feature.js
          grep -q "gerar ou compartilhar um PDF não muda o consentimento" public/terms-feature.js
          grep -q "owner_id=auth.uid()" supabase/phase-clinical-documents-terms.sql
          grep -q "validate_clinical_document_links" supabase/phase-clinical-documents-terms.sql
          grep -q "clinical_document_templates" supabase/phase-clinical-documents-terms.sql
          ! grep -q "create table if not exists public.document_templates (" supabase/phase-clinical-documents-terms.sql
          grep -q "phase02-loader.js" index.html
          grep -q "phase35-loader.js" index.html
          if [ -f public/phase68-loader.js ]; then grep -q "phase68-loader.js" index.html; fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parse documents stylesheets
        run: |
          node -e "require('postcss').parse(require('fs').readFileSync('public/documents-feature.css','utf8'))"
          node -e "require('postcss').parse(require('fs').readFileSync('public/album-feature.css','utf8'))"
          node -e "require('postcss').parse(require('fs').readFileSync('public/referrals-feature.css','utf8'))"
          if [ -f public/record-export-feature.css ]; then node -e "require('postcss').parse(require('fs').readFileSync('public/record-export-feature.css','utf8'))"; fi
          if [ -f public/patient-records-hub.css ]; then node -e "require('postcss').parse(require('fs').readFileSync('public/patient-records-hub.css','utf8'))"; fi
          if [ -f public/patient-workspace.css ]; then node -e "require('postcss').parse(require('fs').readFileSync('public/patient-workspace.css','utf8'))"; fi

      - name: Build application
        run: npm run build
