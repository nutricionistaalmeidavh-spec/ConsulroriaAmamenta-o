name: Apply brand and pricing update on branch

on:
  push:
    branches:
      - feat/brand-pricing-99-999

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: "${{ !contains(github.event.head_commit.message, '[pricing-update-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/brand-pricing-99-999
          fetch-depth: 0

      - name: Apply scoped changes
        run: python3 scripts/apply-pro-pricing-branch-update.py

      - name: Verify targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/index.js
          node --check worker/commercial-seo.js
          node --check public/comercial/landing.js
          node --check public/comercial/mobile-sales-v2.js
          node --check scripts/test-pro-pricing-contract.mjs
          node scripts/test-pro-pricing-contract.mjs
          node scripts/test-commercial-landing.mjs
          node scripts/test-commercial-mobile-first.mjs
          node scripts/test-saas-plans.mjs
          node scripts/test-billing-scaffold.mjs
          node scripts/test-cloudflare-billing-d1.mjs

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(public/comercial/(index\.html|plano\.html|landing\.js|mobile-sales-v2\.js|sandbox-teste\.html|styles\.css|commercial-light-theme\.css)|worker/(commercial-seo\.js|index\.js)|cloudflare/(billing-schema\.sql|runtime-schema\.sql)|supabase/phase-saas-billing\.sql|scripts/(test-saas-plans\.mjs|test-billing-scaffold\.mjs|test-commercial-landing\.mjs|test-cloudflare-billing-d1\.mjs|test-commercial-mobile-first\.mjs|test-pro-pricing-contract\.mjs)|package\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected file outside authorized change surface:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git status --short

      - name: Commit verified branch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/comercial/index.html \
            public/comercial/plano.html \
            public/comercial/landing.js \
            public/comercial/mobile-sales-v2.js \
            public/comercial/sandbox-teste.html \
            public/comercial/styles.css \
            public/comercial/commercial-light-theme.css \
            worker/commercial-seo.js \
            worker/index.js \
            cloudflare/billing-schema.sql \
            cloudflare/runtime-schema.sql \
            supabase/phase-saas-billing.sql \
            scripts/test-saas-plans.mjs \
            scripts/test-billing-scaffold.mjs \
            scripts/test-commercial-landing.mjs \
            scripts/test-cloudflare-billing-d1.mjs \
            scripts/test-commercial-mobile-first.mjs \
            scripts/test-pro-pricing-contract.mjs \
            package.json
          git commit -m 'feat: align brand buttons and Pro pricing [pricing-update-applied]'
          git push origin HEAD:feat/brand-pricing-99-999
