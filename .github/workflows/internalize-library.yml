name: Internalize library asset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/internalize-library.yml'

permissions:
  contents: write

jobs:
  internalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Internalize current Cloudflare library asset
        shell: bash
        run: |
          set -euo pipefail
          target="public/resources/biblioteca-debora-v1-2.zip"
          source="https://consulroriaamamenta-o.nutricionistaalmeidavh.workers.dev/resources/biblioteca-debora-v1-2.zip"
          if [ -s "$target" ]; then
            echo "Asset already internalized."
            exit 0
          fi
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 --retry-delay 2 "$source" --output "$target"
          test -s "$target"
          echo "Downloaded:"
          ls -lh "$target"
          sha256sum "$target"

      - name: Commit asset to repository
        shell: bash
        run: |
          set -euo pipefail
          target="public/resources/biblioteca-debora-v1-2.zip"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: internalize library asset"
          git push
