name: Apply financial hardening patch

on:
  push:
    branches: [hardening/financial-integrity]
    paths: ['.github/workflows/apply-financial-hardening.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/financial-integrity
      - name: Patch finance UI, package idempotency and agenda archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, re, zipfile

          def replace_function(text, name, replacement, next_marker):
              start = text.find(f'function {name}(')
              if start < 0:
                  raise SystemExit(f'{name} not found')
              end = text.find(next_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker for {name} not found')
              return text[:start] + replacement.rstrip() + '\n' + text[end:]

          render_finance = r'''function renderFinance() {
            const root = document.querySelector('[data-finance-live]');
            const now = new Date();
            const todayKey = clinicDayKey(now);
            const visibleFinancial = state.financial.filter((f) => f.status !== 'Cancelado');
            const pending = visibleFinancial.filter((f) => f.status === 'Pendente');
            const paidThisMonth = visibleFinancial.filter((f) => f.status === 'Pago' && sameMonth(f.paid_at || f.updated_at || f.created_at, now));
            const pendingTotal = pending.reduce((sum, f) => sum + Number(f.amount_cents || 0), 0);
            const receivedTotal = paidThisMonth.reduce((sum, f) => sum + Number(f.amount_cents || 0), 0);
            const ticket = paidThisMonth.length ? receivedTotal / paidThisMonth.length : 0;
            setText('[data-kpi-receivable]', currency(pendingTotal));
            setText('[data-finance-received]', currency(receivedTotal));
            setText('[data-finance-received-meta]', `${paidThisMonth.length} ${paidThisMonth.length === 1 ? 'pagamento recebido' : 'pagamentos recebidos'} no mês`);
            setText('[data-finance-receivable]', currency(pendingTotal));
            setText('[data-finance-receivable-meta]', `${pending.length} ${pending.length === 1 ? 'pendência' : 'pendências'}`);
            setText('[data-finance-ticket]', currency(ticket));
            setText('[data-finance-ticket-meta]', paidThisMonth.length ? `${paidThisMonth.length} ${paidThisMonth.length === 1 ? 'pagamento' : 'pagamentos'} no cálculo` : 'sem pagamentos no mês');
            if (!root) return;
            root.innerHTML = visibleFinancial.length ? visibleFinancial.map((f) => {
              const p = patientByMotherId(f.mother_id);
              const dueKey = f.due_at ? String(f.due_at).slice(0, 10) : '';
              const overdue = f.status === 'Pendente' && dueKey && dueKey < todayKey;
              const statusLabel = overdue ? 'Vencido' : f.status;
              const patientAction = f.mother_id ? `<button data-action="open-finance-patient" data-mother-id="${f.mother_id}">Paciente</button>` : '';
              const actions = f.status === 'Pendente'
                ? `${patientAction}<button data-action="finance-whatsapp" data-finance-id="${f.id}">Cobrar</button><button data-action="mark-paid" data-finance-id="${f.id}">Marcar pago</button>`
                : f.status === 'Pago'
                  ? `${patientAction}<button data-action="undo-paid" data-finance-id="${f.id}">Desfazer pagamento</button>`
                  : patientAction;
              const due = f.due_at ? `<small>${overdue ? 'Venceu' : 'Vencimento'}: ${escapeHTML(dateLabel(f.due_at))}</small>` : '';
              return `<article class="agenda-card finance-card"><div class="agenda-main"><strong>${escapeHTML(p?.mother?.name || 'Paciente')}</strong><span>${escapeHTML(f.description || 'Atendimento')}</span>${due}</div><strong class="finance-amount">${escapeHTML(currency(f.amount_cents))}</strong><span class="pill ${f.status === 'Pago' ? 'completed' : 'waiting'}">${escapeHTML(statusLabel)}</span><div class="agenda-actions">${actions}</div></article>`;
            }).join('') : '<div class="empty-live">Nenhum lançamento financeiro ativo.</div>';
          }'''

          def patch_shell(text):
              text = replace_function(text, 'renderFinance', render_finance, '\nasync function refreshData()')
              old = "else if (action === 'mark-paid') { await appData.markFinancialPaid(actionEl.dataset.financeId, 'Pix'); await refreshData(); toast('Pagamento confirmado.', 'success'); }"
              new = r'''else if (action === 'mark-paid') {
                const finance = state.financial.find((item) => item.id === actionEl.dataset.financeId);
                if (!finance) throw new Error('Lançamento financeiro não encontrado.');
                const allowed = ['Pix', 'Dinheiro', 'Cartão', 'Transferência', 'Outro'];
                const suggested = allowed.includes(finance.payment_method) ? finance.payment_method : 'Pix';
                const entered = window.prompt('Forma de pagamento: Pix, Dinheiro, Cartão, Transferência ou Outro', suggested);
                if (entered == null) return;
                const method = allowed.find((item) => item.toLocaleLowerCase('pt-BR') === String(entered).trim().toLocaleLowerCase('pt-BR'));
                if (!method) throw new Error('Forma de pagamento inválida. Use Pix, Dinheiro, Cartão, Transferência ou Outro.');
                if (!window.confirm(`Confirmar o recebimento de ${currency(finance.amount_cents)} via ${method}?`)) return;
                await appData.markFinancialPaid(finance.id, method);
                await refreshData();
                toast('Pagamento confirmado.', 'success');
              }'''
              if old not in text:
                  raise SystemExit('mark-paid handler marker not found')
              text = text.replace(old, new, 1)
              marker = "else if (action === 'finance-whatsapp')"
              if marker not in text:
                  raise SystemExit('finance-whatsapp marker not found')
              text = text.replace(marker, "else if (action === 'open-finance-patient') { const id = actionEl.dataset.motherId; if (id) navigate('patient', id); }\n    " + marker, 1)
              return text

          source = Path('patch-source/agenda/app-shell.js')
          source_text = source.read_text()
          source.write_text(patch_shell(source_text))

          agenda_files = [Path(f'public/release-1.12.0-agenda-{i}.txt') for i in range(1,5)]
          raw_b64 = ''.join(p.read_text().strip() for p in agenda_files)
          archive_bytes = base64.b64decode(raw_b64)
          zin = zipfile.ZipFile(io.BytesIO(archive_bytes), 'r')
          entries = {name: zin.read(name) for name in zin.namelist()}
          zin.close()
          shell_name = 'core/app-shell.js'
          if shell_name not in entries:
              raise SystemExit('core/app-shell.js missing in agenda archive')
          entries[shell_name] = patch_shell(entries[shell_name].decode()).encode()
          out = io.BytesIO()
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
              for name, data in entries.items():
                  zout.writestr(name, data)
          encoded = base64.b64encode(out.getvalue()).decode()
          chunk = (len(encoded) + 3) // 4
          for i, path in enumerate(agenda_files):
              path.write_text(encoded[i*chunk:(i+1)*chunk])

          billing_path = Path('public/billing-v2.js')
          billing = billing_path.read_text()
          cents = "function bvCents(v){const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?Math.max(0,Math.round(n*100)):0}"
          uuid_helper = cents + "\nfunction bvUuid(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}"
          if cents not in billing:
              raise SystemExit('bvCents marker not found')
          billing = billing.replace(cents, uuid_helper, 1)

          submit_start = billing.find('async function bvSubmitPlanItem(form){')
          use_start = billing.find('async function bvUsePlanItem(', submit_start)
          if submit_start < 0 or use_start < 0:
              raise SystemExit('plan item functions not found')
          new_submit = r'''async function bvSubmitPlanItem(form){
            const wrap=form.closest('[data-bv-plan-dialog]'),packageId=wrap?.dataset.packageId;if(!packageId)return;
            if(form.dataset.bvBusy==='1')return;
            const label=form.querySelector('[data-bv-item-label]')?.value?.trim(),qty=Math.max(1,Math.floor(Number(form.querySelector('[data-bv-item-qty]')?.value||1))),pricing=form.querySelector('[data-bv-item-pricing]')?.value||'included',amount=pricing==='additional'?bvCents(form.querySelector('[data-bv-item-amount]')?.value||0):0,notes=form.querySelector('[data-bv-item-notes]')?.value?.trim()||'';
            if(!label)throw new Error('Informe o serviço.');
            if(pricing==='additional'&&amount<=0)throw new Error('Informe o valor adicional.');
            const requestKey=form.dataset.bvRequestKey||(form.dataset.bvRequestKey=bvUuid()),submit=form.querySelector('[type="submit"]');
            form.dataset.bvBusy='1';if(submit)submit.disabled=true;
            try{
              await bvRpc('add_care_package_item_v2',{p_package_id:packageId,p_label:label,p_quantity:qty,p_category:'service',p_pricing_mode:pricing,p_amount_cents:amount,p_notes:notes,p_request_key:requestKey});
              bvClosePlanDialog();await bvMountPatientPlan(true);bvToast('Serviço adicionado ao plano.','success');
            }catch(error){form.dataset.bvBusy='';if(submit)submit.disabled=false;throw error}
          }
          '''
          billing = billing[:submit_start] + new_submit + billing[use_start:]

          use_start = billing.find('async function bvUsePlanItem(')
          schedule_start = billing.find('function bvSchedule()', use_start)
          if use_start < 0 or schedule_start < 0:
              raise SystemExit('use item function bounds not found')
          new_use = r'''async function bvUsePlanItem(itemId,button){
            if(button?.disabled)return;
            if(!window.confirm('Registrar uma utilização deste serviço no plano?'))return;
            const requestKey=button?.dataset.bvRequestKey||(button?button.dataset.bvRequestKey=bvUuid():bvUuid());
            if(button)button.disabled=true;
            try{
              await bvRpc('consume_care_package_item_v2',{p_item_id:itemId,p_appointment_id:null,p_encounter_id:null,p_notes:'',p_request_key:requestKey});
              await bvMountPatientPlan(true);bvToast('Uso registrado no plano.','success');
            }catch(error){if(button)button.disabled=false;throw error}
          }
          '''
          billing = billing[:use_start] + new_use + billing[schedule_start:]
          old_call = "bvUsePlanItem(use.dataset.bvUseItem).catch(err=>bvToast(err.message||String(err),'error'))"
          new_call = "bvUsePlanItem(use.dataset.bvUseItem,use).catch(err=>bvToast(err.message||String(err),'error'))"
          if old_call not in billing:
              raise SystemExit('use item click marker not found')
          billing = billing.replace(old_call, new_call, 1)
          billing_path.write_text(billing)

          sw = Path('public/sw.js')
          sw_text = sw.read_text()
          if "const VERSION='1.12.1'" not in sw_text:
              raise SystemExit('service worker version marker not found')
          sw.write_text(sw_text.replace("const VERSION='1.12.1'", "const VERSION='1.12.2'", 1))
          PY
      - name: Verify source and archive syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/billing-v2.js
          node --check patch-source/agenda/app-shell.js
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,zipfile,subprocess,tempfile
          raw=''.join(Path(f'public/release-1.12.0-agenda-{i}.txt').read_text().strip() for i in range(1,5))
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(raw)))
          shell=z.read('core/app-shell.js').decode()
          assert 'pagamento recebido' in shell
          assert 'open-finance-patient' in shell
          assert "Forma de pagamento: Pix" in shell
          assert 'add_care_package_item_v2' in Path('public/billing-v2.js').read_text()
          assert 'consume_care_package_item_v2' in Path('public/billing-v2.js').read_text()
          Path('/tmp/agenda-shell.js').write_text(shell)
          subprocess.run(['node','--check','/tmp/agenda-shell.js'],check=True)
          PY
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patched application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patch-source/agenda/app-shell.js public/release-1.12.0-agenda-*.txt public/billing-v2.js public/sw.js
          git commit -m "feat: harden financial UX and package retries"
          git push origin HEAD:hardening/financial-integrity
