name: Apply frontend Cloudflare cutover

on:
  push:
    branches:
      - refactor/frontend-cloudflare-only
    paths:
      - 'scripts/materialize-cloudflare-frontend.mjs'
      - '.github/workflows/apply-frontend-cloudflare-cutover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-cloudflare-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply Cloudflare-only frontend materialization
        run: node scripts/materialize-cloudflare-frontend.mjs --write
      - name: Verify cutover tests
        run: npm run test:frontend-cutover
      - name: Commit generated cutover
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public package.json scripts/materialize-clinical-source.mjs
          git commit -m "refactor: refresh Cloudflare-only frontend"
          git push origin HEAD:refactor/frontend-cloudflare-only
