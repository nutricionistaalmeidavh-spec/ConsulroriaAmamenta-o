name: Validate clinical source consolidation

on:
  push:
    branches:
      - main
      - refactor/clinical-source-consolidation-work
      - feature/canonical-multiclient-routing
  pull_request:
    paths:
      - 'index.html'
      - 'app/**'
      - 'vite.config.js'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'src/bootstrap.js'
      - 'src/app-identity.js'
      - 'public/sw.js'
      - 'public/manifest.webmanifest'
      - 'public/canonical-identity-runtime.js'
      - 'public/clinical-source/**'
      - 'public/debora/**'
      - 'public/comercial/**'
      - 'worker/cloudflare-clinical-runtime.js'
      - 'worker/deploy-version.js'
      - 'scripts/deploy-cloudflare-billing.ps1'
      - 'scripts/materialize-clinical-source.mjs'
      - 'scripts/test-canonical-app-routing.mjs'
      - 'tests/clinical-source-*.test.mjs'
      - 'tests/deploy-hardening-p01.test.mjs'
      - 'tests/e2e/**'
      - '.github/workflows/validate-clinical-source-consolidation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --test tests/clinical-source-*.test.mjs
      - name: Validate commercial and SaaS regressions
        run: |
          node scripts/test-commercial-funnel.mjs
          node scripts/test-commercial-auth-recovery.mjs
          node scripts/test-commercial-checkout-return.mjs
          node scripts/test-commercial-landing.mjs
          node scripts/test-deferred-email-flow.mjs
          node scripts/test-preconfirm-checkout.mjs
          node scripts/test-duplicate-signup-flow.mjs
          node scripts/test-saas-foundation.mjs
          node scripts/test-saas-plans.mjs
          node scripts/test-saas-enforcement.mjs
          node scripts/test-billing-scaffold.mjs
      - name: Validate current Cloudflare Asaas contract
        run: node scripts/test-cloudflare-asaas.mjs
      - name: Validate P0.1 deployment hardening contract
        run: npm run test:deploy-safety
      - name: Syntax-check Cloudflare worker
        run: |
          node --check worker/index.js
          node --check worker/cloudflare-clinical-runtime.js
      - run: npm run build
      - name: Install Chromium for cache-upgrade E2E
        run: npx playwright install --with-deps chromium
      - name: Verify version N to N+1 cache upgrade
        run: npx playwright test tests/e2e/deploy-version-upgrade.spec.mjs
      - name: Validate canonical multi-client routing on materialized runtime
        run: node scripts/test-canonical-app-routing.mjs
      - name: Verify canonical runtime is published
        run: |
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/debora/index.html
          test -f dist/comercial/index.html
          test -f dist/clinical-source/index.html
          test -f dist/clinical-source/core/app-shell.js
          test -f dist/clinical-source/core/lib/supabase-client.js
          test -f dist/clinical-source/features/clinical-note-feature.js
          test -f dist/clinical-source/manifest.json
