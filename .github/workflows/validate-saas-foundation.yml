      - 'scripts/test-cloudflare-runtime.mjs'
      - 'scripts/test-cloudflare-license-authority.mjs'
      - 'scripts/normalize-growth-runtime.mjs'
      - 'scripts/test-production-deploy-contract.mjs'
      - 'scripts/deploy-cloudflare-billing.ps1'
