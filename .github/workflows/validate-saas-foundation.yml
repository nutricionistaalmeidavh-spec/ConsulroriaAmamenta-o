name: Validate SaaS foundation

on:
  push:
    branches:
      - main
      - feature/saas-foundation-phase-0-2
      - feature/pro-checkout-before-email-confirmation
      - fix/commercial-duplicate-signup-flow
    paths:
      - 'scripts/test-saas-foundation.mjs'
      - 'scripts/test-commercial-funnel.mjs'
      - 'scripts/test-commercial-landing.mjs'
      - 'scripts/test-commercial-checkout-return.mjs'
      - 'scripts/test-preconfirm-checkout.mjs'
      - 'scripts/test-deferred-email-flow.mjs'
      - 'scripts/validate-deferred-email-migration.mjs'
      - 'supabase/phase-pro-checkout-deferred-email.sql'
      - 'supabase/functions/_shared/**'
      - 'scripts/test-duplicate-signup-flow.mjs'
      - 'scripts/test-commercial-auth-recovery.mjs'
      - 'scripts/test-saas-plans.mjs'
      - 'scripts/test-saas-enforcement.mjs'
      - 'scripts/test-billing-scaffold.mjs'
      - 'scripts/test-cloudflare-asaas.mjs'
      - 'supabase/phase-saas-foundation.sql'
      - 'supabase/phase-saas-enforcement.sql'
      - 'supabase/phase-saas-billing.sql'
      - 'supabase/functions/saas-checkout/**'
      - 'supabase/functions/saas-billing-webhook/**'
      - 'public/comercial/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-saas-foundation.yml'
  pull_request:
    paths:
      - 'scripts/test-saas-foundation.mjs'
      - 'scripts/test-commercial-funnel.mjs'
      - 'scripts/test-commercial-landing.mjs'
      - 'scripts/test-commercial-checkout-return.mjs'
      - 'scripts/test-preconfirm-checkout.mjs'
      - 'scripts/test-deferred-email-flow.mjs'
      - 'scripts/validate-deferred-email-migration.mjs'
      - 'supabase/phase-pro-checkout-deferred-email.sql'
      - 'supabase/functions/_shared/**'
      - 'scripts/test-duplicate-signup-flow.mjs'
      - 'scripts/test-commercial-auth-recovery.mjs'
      - 'scripts/test-saas-plans.mjs'
      - 'scripts/test-saas-enforcement.mjs'
      - 'scripts/test-billing-scaffold.mjs'
      - 'scripts/test-cloudflare-asaas.mjs'
      - 'supabase/phase-saas-foundation.sql'
      - 'supabase/phase-saas-enforcement.sql'
      - 'supabase/phase-saas-billing.sql'
      - 'supabase/functions/saas-checkout/**'
      - 'supabase/functions/saas-billing-webhook/**'
      - 'public/comercial/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-saas-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saas-foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate additive SaaS contract
        run: node scripts/test-saas-foundation.mjs
      - name: Validate commercial funnel and onboarding
        run: node scripts/test-commercial-funnel.mjs
      - name: Validate commercial landing Phase 2
        run: node scripts/test-commercial-landing.mjs
      - name: Validate commercial checkout continuation
        run: node scripts/test-commercial-checkout-return.mjs
      - name: Validate Pro checkout before e-mail confirmation
        run: node scripts/test-preconfirm-checkout.mjs
      - name: Validate deferred email behavior
        run: node scripts/test-deferred-email-flow.mjs
      - name: Validate migration on isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/pro-checkout-test" @electric-sql/pglite@0.5.8 --ignore-scripts
          PGLITE_MODULE="$RUNNER_TEMP/pro-checkout-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/validate-deferred-email-migration.mjs
      - name: Validate existing e-mail signup continuation
        run: node scripts/test-duplicate-signup-flow.mjs
      - name: Validate commercial password recovery
        run: node scripts/test-commercial-auth-recovery.mjs
      - name: Validate Freemium and Pro plans
        run: node scripts/test-saas-plans.mjs
      - name: Validate server-side SaaS enforcement
        run: node scripts/test-saas-enforcement.mjs
      - name: Validate My Plan and billing scaffold
        run: node scripts/test-billing-scaffold.mjs
      - name: Validate Cloudflare Asaas worker contract
        run: node scripts/test-cloudflare-asaas.mjs
      - name: Syntax-check Cloudflare worker
        run: node --check worker/index.js
