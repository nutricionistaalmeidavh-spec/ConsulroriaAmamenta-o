      - 'public/clinical-source/**'
      - 'public/growth-feature.js'
      - 'cloudflare/**'
      - 'public/comercial/**'
      - 'public/debora/**'
      - 'public/admin/seo/**'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'worker/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-saas-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saas-foundation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate additive SaaS contract
        run: node scripts/test-saas-foundation.mjs
      - name: Validate commercial funnel and onboarding
        run: node scripts/test-commercial-funnel.mjs
      - name: Validate commercial landing Phase 2
        run: node scripts/test-commercial-landing.mjs
      - name: Validate commercial checkout continuation
        run: node scripts/test-commercial-checkout-return.mjs
      - name: Validate D1 staged Pro signup and automatic activation
        run: node scripts/test-preconfirm-checkout.mjs
      - name: Validate D1 partner attribution, commissions and discounts
        run: node scripts/test-partner-attribution.mjs
      - name: Validate D1 recurring Asaas reconciliation
        run: node scripts/test-asaas-recurring-renewal.mjs
      - name: Validate existing e-mail signup continuation
        run: node scripts/test-duplicate-signup-flow.mjs
      - name: Validate commercial password recovery
        run: node scripts/test-commercial-auth-recovery.mjs
      - name: Validate Freemium and Pro plans
        run: node scripts/test-saas-plans.mjs
      - name: Validate server-side SaaS enforcement
        run: node scripts/test-saas-enforcement.mjs
      - name: Validate My Plan and billing scaffold
        run: node scripts/test-billing-scaffold.mjs
      - name: Validate Cloudflare D1 Asaas worker contract
        run: node scripts/test-cloudflare-asaas.mjs
      - name: Validate Cloudflare billing, partner attribution and automatic post-payment activation
        run: node scripts/test-cloudflare-billing-d1.mjs
      - name: Validate production deploy guard
        run: node scripts/test-production-deploy-contract.mjs
      - name: Validate package lifecycle on Cloudflare
        run: node --test tests/package-lifecycle-cloudflare.test.mjs
      - name: Validate Block 6 RPC closure
        run: npm run test:block6
      - name: Validate Block 7 no-core fallback
        run: npm run test:block7
      - name: Validate Block 9 D1 hardening
        run: npm run test:block9
      - name: Validate Block 10 zero-Supabase runtime
        run: npm run test:block10
      - name: Validate D1-only authentication
        run: node --test worker/cloudflare-auth-runtime.test.mjs worker/cloudflare-auth-compat.test.mjs tests/cloudflare-auth-guardrail.test.mjs
      - name: Validate Block 1 and 2 Cloudflare regressions
        run: npm run test:cloudflare-regressions
      - name: Install Block 5 test runtime
        run: npm install --no-audit --no-fund
      - name: Validate native recovery and bootstrap
        run: npm run test:block5
      - name: Validate frontend Cloudflare cutover
        run: node --test tests/frontend-cloudflare-cutover.test.mjs
      - name: Validate SEO API contract
        run: node --test worker/seo-*.test.mjs
      - name: Validate public SEO contract
        run: node scripts/test-public-seo.mjs
      - name: Syntax-check changed commercial runtime
        run: |
          node --check worker/index.js
          node --check worker/cloudflare-auth-runtime.js
          node --check worker/cloudflare-auth-compat.js
          node --check worker/cloudflare-clinical-runtime.js
          node --check worker/cloudflare-clinical-legacy-runtime.js
          if [ -f worker/cloudflare-data-runtime.js ]; then node --check worker/cloudflare-data-runtime.js; fi
          node --check worker/cloudflare-billing-runtime.js
          node --check worker/package-lifecycle-runtime.js
          node --check worker/block6-rpc-runtime.js
          node --check worker/patient-write-runtime.js
          node --check worker/d1-record-store.js
          node --check worker/commercial-license-bootstrap.js
          node --check worker/domain-entry.js
          node --check worker/seo-search-console.js
          node --check public/comercial/app.js
          node --check public/comercial/plan.js
          node --check public/comercial/parceiros.js
          node --check public/comercial/purchase-status.js
