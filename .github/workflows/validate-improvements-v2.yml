name: Validate improvements v2

on:
  push:
    branches:
      - improvements-v2
    paths:
      - 'public/release-1.12.0-agenda-*.txt'
      - 'public/improvements-v2.css'
      - 'src/bootstrap.js'
      - 'patch-source/agenda/**'
      - 'package.json'
      - '.github/workflows/validate-improvements-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout improvements branch
        uses: actions/checkout@v4

      - name: Validate packed agenda release
        shell: bash
        run: |
          set -euo pipefail
          cat public/release-1.12.0-agenda-1.txt public/release-1.12.0-agenda-2.txt public/release-1.12.0-agenda-3.txt public/release-1.12.0-agenda-4.txt | tr -d '\r\n' | base64 --decode > /tmp/agenda.zip
          unzip -t /tmp/agenda.zip
          rm -rf /tmp/agenda
          mkdir -p /tmp/agenda
          unzip -q /tmp/agenda.zip -d /tmp/agenda
          cmp patch-source/agenda/app-shell.js /tmp/agenda/core/app-shell.js
          cmp patch-source/agenda/app-data.js /tmp/agenda/core/lib/app-data.js

      - name: Validate phase 1 agenda single source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "startClinicalEncounterFromAppointment" /tmp/agenda/core/app-shell.js
          grep -q "start_clinical_encounter_from_appointment" /tmp/agenda/core/lib/app-data.js
          grep -q "start_clinical_encounter" /tmp/agenda/core/lib/app-data.js

      - name: Validate phase 2 reversible finance
        shell: bash
        run: |
          set -euo pipefail
          grep -q "set_financial_payment_state" /tmp/agenda/core/lib/app-data.js
          grep -q "undoFinancialPaid" /tmp/agenda/core/lib/app-data.js
          grep -q "Desfazer pagamento" /tmp/agenda/core/app-shell.js

      - name: Validate phase 3 follow-up consolidation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "create_or_supersede_followup" /tmp/agenda/core/lib/app-data.js
          grep -q "createOrSupersedeFollowup" /tmp/agenda/core/app-shell.js
          grep -q "groupedByPatient" /tmp/agenda/core/app-shell.js

      - name: Validate phase 4 mobile containment
        shell: bash
        run: |
          set -euo pipefail
          grep -q "improvements-v2.css" src/bootstrap.js
          grep -q "overflow-x: hidden" public/improvements-v2.css
          grep -q "\[data-date-strip-live\]" public/improvements-v2.css
          grep -q "min-width: 0" public/improvements-v2.css

      - name: Validate phase 5 dashboard source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "listFinalizedEncounters" /tmp/agenda/core/app-shell.js
          grep -q "status=eq.finalized" /tmp/agenda/core/lib/app-data.js
          grep -q "state.encounters" /tmp/agenda/core/app-shell.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build
