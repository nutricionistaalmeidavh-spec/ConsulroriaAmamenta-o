name: Validate plan and logo hotfix

on:
  push:
    branches:
      - hotfix/plan-logo-flexible-items
    paths:
      - 'public/billing-v2.js'
      - 'public/billing-v2.css'
      - 'public/phase8-design.css'
      - 'supabase/phase-flexible-package-items.sql'
      - '.github/workflows/validate-plan-logo-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate logo asset usage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'icon.svg?v=1.12.2' public/phase8-design.css
          test -f public/icon.svg
          grep -q '<svg' public/icon.svg
      - name: Validate flexible package UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'add_care_package_item' public/billing-v2.js
          grep -q 'consume_care_package_item' public/billing-v2.js
          grep -q 'data-bv-add-item' public/billing-v2.js
          grep -q 'Auriculoterapia, laser, taping' public/billing-v2.js
          grep -q 'bv-plan-dialog' public/billing-v2.css
          grep -q 'care_package_items' supabase/phase-flexible-package-items.sql
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Parse styles
        run: |
          node -e "const p=require('postcss');const fs=require('fs');p.parse(fs.readFileSync('public/billing-v2.css','utf8'));p.parse(fs.readFileSync('public/phase8-design.css','utf8'))"
      - name: Build
        run: npm run build
