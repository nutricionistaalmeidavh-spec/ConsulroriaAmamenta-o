name: Apply Cloudflare-only cutover once

on:
  push:
    branches:
      - refactor/cloudflare-only-runtime
    paths:
      - '.github/workflows/apply-cloudflare-only-cutover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cloudflare-only-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix codemod empty replacement guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-cloudflare-only-cutover.mjs')
          s = p.read_text()
          old = "if (typeof replacement === 'string' && source.includes(replacement)) return source;"
          new = "if (typeof replacement === 'string' && replacement.length > 0 && source.includes(replacement)) return source;"
          if old not in s and new not in s:
              raise SystemExit('codemod guard anchor missing')
          p.write_text(s.replace(old, new))
          PY
      - name: Apply cutover transformations
        run: node scripts/apply-cloudflare-only-cutover.mjs
      - name: Restore workflow files before push
        run: git restore --source=HEAD --staged --worktree .github/workflows
      - name: Commit generated runtime cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: remove legacy Supabase runtime paths"
          git push origin HEAD:refactor/cloudflare-only-runtime
