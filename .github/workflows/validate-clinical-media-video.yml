name: Validate clinical media video

on:
  push:
    branches:
      - feature/clinical-media-video
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check public/album-feature.js
          node --check public/documents-feature.js
          node --check public/terms-feature.js
          node --check public/phase35-loader.js
      - name: Run clinical contracts
        run: |
          node --test tests/phase35-contracts.test.mjs
          node --test tests/phase68-contracts.test.mjs
      - name: Parse clinical stylesheet
        run: |
          npm install --no-audit --no-fund
          node -e "require('postcss').parse(require('fs').readFileSync('public/album-feature.css','utf8'))"
      - name: Build application
        run: npm run build
