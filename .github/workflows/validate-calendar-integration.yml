name: Calendar integration validation
on:
  pull_request:
    paths:
      - 'worker/calendar-integration.js'
      - 'worker/apple-calendar-integration.js'
      - 'cloudflare/migrations/0012-calendar-apple.sql'
      - 'tests/apple-calendar-integration.test.mjs'
      - 'worker/domain-entry.js'
      - 'public/calendar-integration-feature.js'
      - 'src/bootstrap.js'
      - 'cloudflare/runtime-schema.sql'
      - 'cloudflare/migrations/0011-calendar-google.sql'
      - 'tests/calendar-integration.test.mjs'
      - '.github/workflows/validate-calendar-integration.yml'
  push:
    branches: [main]
    paths:
      - 'worker/calendar-integration.js'
      - 'worker/apple-calendar-integration.js'
      - 'cloudflare/migrations/0012-calendar-apple.sql'
      - 'tests/apple-calendar-integration.test.mjs'
      - 'worker/domain-entry.js'
      - 'public/calendar-integration-feature.js'
      - 'src/bootstrap.js'
      - 'cloudflare/runtime-schema.sql'
      - 'cloudflare/migrations/0011-calendar-google.sql'
      - 'tests/calendar-integration.test.mjs'
permissions:
  contents: read
jobs:
  calendar-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime syntax
        run: |
          node --check worker/calendar-integration.js
          node --check worker/apple-calendar-integration.js
          node --check worker/domain-entry.js
          node --check public/calendar-integration-feature.js
          node --check src/bootstrap.js
      - name: Calendar security and iCalendar tests
        run: node --test tests/calendar-integration.test.mjs tests/apple-calendar-integration.test.mjs
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build canonical clinical shell
        run: npm run build
