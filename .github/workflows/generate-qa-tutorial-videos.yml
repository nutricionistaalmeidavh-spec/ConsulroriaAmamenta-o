name: Generate QA tutorial videos
# Web SaaS recording pipeline

on:
  push:
    branches:
      - qa/tutorial-video-artifacts
    paths:
      - 'tests/e2e/**'
      - 'tests/e2e-mobile/**'
      - 'tests/helpers/**'
      - 'scripts/materialize-clinical-source.mjs'
      - 'scripts/materialize-cloudflare-frontend.mjs'
      - 'public/member-feature.js'
      - 'playwright.config.mjs'
      - 'playwright.mobile.config.mjs'
      - 'playwright.tutorial.web.config.mjs'
      - 'playwright.tutorial.web-mobile.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-qa-tutorial-videos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-tutorial-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-wide-recording:
    name: Web QA recordings - tela grande
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build final materialized application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web QA (wide viewport) with video recording
        run: npx playwright test --config=playwright.tutorial.web.config.mjs

      - name: Upload web wide-screen QA videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tutorial-web-wide-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results
            artifacts/tutorial-web-report
          if-no-files-found: warn
          retention-days: 30

      - name: Package videos - Acesso e Conta
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-01-acesso-conta-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/auth-session-*/video*.webm
            artifacts/tutorial-web-results/recovery-*/video*.webm
            artifacts/tutorial-web-results/clinical-login-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Inicio e Dashboard
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-02-dashboard-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/tutorial-dashboard-*/video*.webm
          if-no-files-found: warn
          retention-days: 30

      - name: Package videos - Agenda
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-03-agenda-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/agenda-p1-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Pacientes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-04-pacientes-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/patient-critical-*/video*.webm
            artifacts/tutorial-web-results/patient-quick-actions-*/video*.webm
            artifacts/tutorial-web-results/patient-address-*/video*.webm
            artifacts/tutorial-web-results/p0-ui-integrity-patient-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Evolucao do Bebe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-05-evolucao-bebe-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/growth-card-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Atendimento Clinico
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-06-atendimento-clinico-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/final-materialized-clinica-*/video*.webm
            artifacts/tutorial-web-results/clinical-persistence-*/video*.webm
            artifacts/tutorial-web-results/p1-integrity-starting-an-e-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Prontuario e Documentos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-07-prontuario-documentos-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/p0-ui-integrity-clinical-n-*/video*.webm
            artifacts/tutorial-web-results/p1-integrity-clinical-note-*/video*.webm
            artifacts/tutorial-web-results/p1-integrity-terms-*/video*.webm
            artifacts/tutorial-web-results/p1-integrity-referrals-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package videos - Follow-ups e Acompanhamentos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-08-followups-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/tutorial-followups-*/video*.webm
          if-no-files-found: warn
          retention-days: 30

      - name: Package videos - Financeiro e Planos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-09-financeiro-planos-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/package-new-value-ui-*/video*.webm
            artifacts/tutorial-web-results/package-concurrency-p1-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Package QA evidence - Biblioteca desativada
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-10-biblioteca-desativada-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/tutorial-library-*/video*.webm
          if-no-files-found: warn
          retention-days: 30

      - name: Package videos - Area da Mae e Configuracoes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-11-area-mae-configuracoes-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/tutorial-member-settings-*/video*.webm
          if-no-files-found: warn
          retention-days: 30

      - name: Package videos - QA tecnico
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-00-qa-tecnico-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results/cache-staleness-*/video*.webm
            artifacts/tutorial-web-results/concurrency-p1-*/video*.webm
            artifacts/tutorial-web-results/deploy-version-upgrade-*/video*.webm
            artifacts/tutorial-web-results/isolation-*/video*.webm
            artifacts/tutorial-web-results/network-resilience-*/video*.webm
            artifacts/tutorial-web-results/pwa-cache-p1-*/video*.webm
            artifacts/tutorial-web-results/stability-*/video*.webm
            artifacts/tutorial-web-results/p1-integrity-documents-bil-*/video*.webm
          if-no-files-found: ignore
          retention-days: 30

  web-mobile-recording:
    name: Web QA recordings - mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build final materialized application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web QA (mobile viewport) with video recording
        run: npx playwright test --config=playwright.tutorial.web-mobile.config.mjs

      - name: Upload web mobile QA videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tutorial-web-mobile-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-mobile-results
            artifacts/tutorial-web-mobile-report
          if-no-files-found: warn
          retention-days: 30
