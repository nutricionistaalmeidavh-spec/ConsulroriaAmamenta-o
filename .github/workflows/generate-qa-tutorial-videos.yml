name: Generate QA tutorial videos

on:
  push:
    branches:
      - qa/tutorial-video-artifacts
    paths:
      - 'tests/e2e/**'
      - 'tests/e2e-mobile/**'
      - 'tests/helpers/**'
      - 'playwright.config.mjs'
      - 'playwright.mobile.config.mjs'
      - 'playwright.tutorial.web.config.mjs'
      - 'playwright.tutorial.web-mobile.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-qa-tutorial-videos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-tutorial-videos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-wide-recording:
    name: Web QA recordings - tela grande
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build final materialized application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web QA (wide viewport) with video recording
        run: npx playwright test --config=playwright.tutorial.web.config.mjs

      - name: Upload web wide-screen QA videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tutorial-web-wide-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-results
            artifacts/tutorial-web-report
          if-no-files-found: warn
          retention-days: 30

  web-mobile-recording:
    name: Web QA recordings - mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build final materialized application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web QA (mobile viewport) with video recording
        run: npx playwright test --config=playwright.tutorial.web-mobile.config.mjs

      - name: Upload web mobile QA videos and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-tutorial-web-mobile-${{ github.run_id }}
          path: |
            artifacts/tutorial-web-mobile-results
            artifacts/tutorial-web-mobile-report
          if-no-files-found: warn
          retention-days: 30
