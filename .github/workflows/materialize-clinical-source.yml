name: Materialize clinical source

on:
  push:
    branches:
      - refactor/clinical-source-consolidation-work
    paths:
      - 'scripts/materialize-clinical-source.mjs'
      - '.github/workflows/materialize-clinical-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/materialize-clinical-source.mjs --write
      - run: node scripts/materialize-clinical-source.mjs --verify
      - run: node --test tests/clinical-source-*.test.mjs
      - run: npm run build
      - name: Commit canonical clinical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clinical-source
          if git diff --cached --quiet; then
            echo "No clinical source changes to commit."
          else
            git commit -m "refactor: materialize complete clinical source"
            git push
          fi
