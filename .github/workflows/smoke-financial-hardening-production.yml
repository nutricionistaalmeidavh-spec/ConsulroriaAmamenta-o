name: Smoke financial hardening production

on:
  push:
    branches:
      - hardening/financial-integrity
    paths:
      - .github/workflows/smoke-financial-hardening-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://consulroriaamamenta-o.nutricionistaalmeidavh.workers.dev"
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "$URL/" || true)
            curl -fsSL "$URL/sw.js" -o /tmp/sw.js || true
            curl -fsSL "$URL/billing-v2.js" -o /tmp/billing.js || true
            if [ "$code" = "200" ] && grep -q "VERSION='1.12.2'" /tmp/sw.js && grep -q "add_care_package_item_v2" /tmp/billing.js && grep -q "consume_care_package_item_v2" /tmp/billing.js; then
              echo "Financial hardening is live on Cloudflare"
              exit 0
            fi
            echo "Attempt $i of 36"
            sleep 10
          done
          echo "Production did not expose the expected hardening assets in time"
          exit 1
