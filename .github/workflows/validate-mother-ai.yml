name: Validate zero-spend mother AI foundation
on:
  pull_request:
    paths:
      - 'worker/mother-ai-*.js'
      - 'public/mother-ai-feature.js'
      - 'public/member-feature.js'
      - 'public/member-feature.css'
      - 'tests/mother-ai-guidance-history.test.mjs'
      - 'tests/mother-ai-clinical-pilot.test.mjs'
      - 'cloudflare/migrations/0015-mother-ai-pilot-telemetry.sql'
      - 'cloudflare/migrations/0014-mother-ai-history.sql'
      - 'tests/mother-ai-zero-spend.test.mjs'
      - 'cloudflare/migrations/0013-mother-ai-budget.sql'
      - 'worker/domain-entry.js'
      - 'package.json'
      - '.github/workflows/validate-mother-ai.yml'
  workflow_dispatch:
jobs:
  mother-ai-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install existing test dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Validate JavaScript syntax
        run: |
          node --check worker/mother-ai-chat-runtime.js
          node --check worker/mother-ai-safety.js
          node --check worker/mother-ai-knowledge.js
          node --check worker/mother-ai-history-runtime.js
          node --check worker/mother-ai-context.js
          node --check worker/mother-ai-pilot.js
          node --check worker/mother-ai-identity.js
          node --check public/mother-ai-feature.js
          node --check worker/domain-entry.js
      - name: Run unit and real SQLite D1 security tests
        run: npm run test:mother-ai
      - name: Recheck member portal regressions
        run: npm run test:block6
