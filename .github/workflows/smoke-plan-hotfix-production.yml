name: Smoke plan hotfix production

on:
  push:
    branches: [hotfix/plan-logo-flexible-items]
    paths: ['.github/workflows/smoke-plan-hotfix-production.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare and validate hotfix assets
        shell: bash
        run: |
          set -euo pipefail
          URL="https://consulroriaamamenta-o.nutricionistaalmeidavh.workers.dev"
          ok=0
          for i in $(seq 1 36); do
            code="$(curl -L -sS -o /tmp/root.html -w '%{http_code}' "$URL/" || true)"
            if [ "$code" = "200" ]; then
              curl -fsSL "$URL/phase8-design.css" -o /tmp/phase8.css || true
              curl -fsSL "$URL/billing-v2.js" -o /tmp/billing.js || true
              curl -fsSL "$URL/billing-v2.css" -o /tmp/billing.css || true
              curl -fsSL "$URL/icon.svg" -o /tmp/icon.svg || true
              if grep -q 'icon.svg?v=1.12.2' /tmp/phase8.css                 && grep -q 'add_care_package_item' /tmp/billing.js                 && grep -q 'consume_care_package_item' /tmp/billing.js                 && grep -q 'bv-plan-dialog' /tmp/billing.css                 && grep -q '<svg' /tmp/icon.svg; then
                  ok=1
                  break
              fi
            fi
            echo "Tentativa $i/36; aguardando Cloudflare..."
            sleep 10
          done
          test "$ok" = "1"
          echo "Plan/logo hotfix is live on Cloudflare"
