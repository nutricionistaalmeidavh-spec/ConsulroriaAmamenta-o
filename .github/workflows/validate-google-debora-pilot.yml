name: Validate Debora-only Google Calendar pilot
on:
  pull_request:
    paths:
      - 'worker/google-calendar-integration.js'
      - 'public/google-calendar-debora-feature.js'
      - 'worker/domain-entry.js'
      - 'src/bootstrap.js'
      - 'cloudflare/runtime-schema.sql'
      - 'cloudflare/migrations/0013-calendar-google-debora-pilot.sql'
      - 'tests/google-calendar-debora-pilot.test.mjs'
      - '.github/workflows/validate-google-debora-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'worker/google-calendar-integration.js'
      - 'public/google-calendar-debora-feature.js'
      - 'worker/domain-entry.js'
      - 'src/bootstrap.js'
      - 'cloudflare/runtime-schema.sql'
      - 'cloudflare/migrations/0013-calendar-google-debora-pilot.sql'
      - 'tests/google-calendar-debora-pilot.test.mjs'
permissions:
  contents: read
jobs:
  pilot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check worker/google-calendar-integration.js
          node --check worker/domain-entry.js
          node --check public/google-calendar-debora-feature.js
          node --check src/bootstrap.js
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Prove scope, privacy, pilot-only authorization and Apple compatibility
        run: node --test tests/google-calendar-debora-pilot.test.mjs tests/apple-calendar-integration.test.mjs
      - name: Build Cloudflare static app
        run: npm run build
      - name: Confirm Google pilot and Apple features present
        run: |
          test -f dist/google-calendar-debora-feature.js
          test -f dist/apple-calendar-feature.js
