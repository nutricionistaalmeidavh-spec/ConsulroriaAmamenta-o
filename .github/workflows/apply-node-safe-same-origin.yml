name: Apply Node-safe same-origin once

on:
  push:
    branches:
      - refactor/cloudflare-only-runtime
    paths:
      - '.github/workflows/apply-node-safe-same-origin.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cloudflare-only-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Node-safe same-origin constants
        run: node scripts/make-same-origin-runtime-node-safe.mjs
      - name: Restore workflow files before push
        run: git restore --source=HEAD --staged --worktree .github/workflows
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: make same-origin browser runtimes Node-safe"
          git push origin HEAD:refactor/cloudflare-only-runtime
