labels:
  platform: windows/amd64
  backend: local

when:
  - event: manual

steps:
  - name: preparar
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - 'New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null'
      - 'Remove-Item ".\artifacts\current-step.txt", ".\artifacts\woodpecker-ci-report.json" -Force -ErrorAction SilentlyContinue'
      - '"preparar" | Set-Content ".\artifacts\current-step.txt"'
      - '"=== debora lactacao ===" | Set-Content ".\artifacts\woodpecker-debora.log"'

  - name: dependencias
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '"dependencias" | Set-Content ".\artifacts\current-step.txt"'
      - '$npm=(Get-Command npm.cmd -ErrorAction Stop).Source'
      - '& $npm ci *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "npm install falhou com exit $LASTEXITCODE"}'

  - name: testes-seo-comercial
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '"test:seo" | Set-Content ".\artifacts\current-step.txt"'
      - '$npm=(Get-Command npm.cmd -ErrorAction Stop).Source'
      - '& $npm run test:auth-runtime *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "test:auth-runtime falhou com exit $LASTEXITCODE"}'
      - '& $npm run test:deploy-safety *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "test:deploy-safety falhou com exit $LASTEXITCODE"}'
      - '& $npm run test:seo *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "test:seo falhou com exit $LASTEXITCODE"}'

  - name: build
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '"build" | Set-Content ".\artifacts\current-step.txt"'
      - '$npm=(Get-Command npm.cmd -ErrorAction Stop).Source'
      - '& $npm run build *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "build falhou com exit $LASTEXITCODE"}'

  - name: deploy-cloudflare
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - '"deploy-cloudflare" | Set-Content ".\artifacts\current-step.txt"'
      - '$npm=(Get-Command npm.cmd -ErrorAction Stop).Source'
      - '& $npm run deploy:production *>&1 | Tee-Object -FilePath ".\artifacts\woodpecker-debora.log" -Append'
      - 'if($LASTEXITCODE -ne 0){throw "deploy Cloudflare protegido falhou com exit $LASTEXITCODE"}'
      - 'node .\scripts\woodpecker-ci-report.mjs --status pass --output .\artifacts\woodpecker-ci-report.json'
      - 'Remove-Item ".\artifacts\current-step.txt" -ErrorAction SilentlyContinue'

  - name: reportar-sucesso-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\woodpecker-ci-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-debora.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/debora-lactacao'
      ARTISYS_CI_RESULT: 'success'
      ARTISYS_COMMENT_SUCCESS: 'false'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference="Continue"'
      - '$reporter=Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"; if(Test-Path $reporter){node $reporter}else{Write-Warning "Reporter ausente: $reporter"}'
    when:
      - event: [push, manual]
        status: [success]
    failure: ignore

  - name: reportar-falha-github
    image: powershell.exe
    environment:
      ARTISYS_UTILIDADES_PATH: 'C:\VICTOR\Artisys\AgroFrota\utilidades'
      ARTISYS_REPORT_PATH: '.\artifacts\woodpecker-ci-report.json'
      ARTISYS_LOG_PATH: '.\artifacts\woodpecker-debora.log'
      ARTISYS_STATUS_CONTEXT: 'ci/woodpecker/debora-lactacao'
      ARTISYS_CI_RESULT: 'failure'
      ARTISYS_INSTALLER_REQUIRED: 'false'
    commands:
      - '$ErrorActionPreference="Continue"'
      - '$step=if(Test-Path ".\artifacts\current-step.txt"){(Get-Content ".\artifacts\current-step.txt" -Raw).Trim()}else{"pipeline"}'
      - 'node .\scripts\woodpecker-ci-report.mjs --status fail --failed-step $step --output .\artifacts\woodpecker-ci-report.json'
      - '$reporter=Join-Path $env:ARTISYS_UTILIDADES_PATH "modules\artisys-ci-reporter\bin\artisys-ci-reporter.mjs"; if(Test-Path $reporter){node $reporter}else{Write-Warning "Reporter ausente: $reporter"}'
    when:
      - event: [push, manual]
        status: [failure]
    failure: ignore
