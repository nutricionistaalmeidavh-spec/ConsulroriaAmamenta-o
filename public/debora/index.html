<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#160f0d" />
  <meta name="description" content="Apoio individualizado e orientação em amamentação." />
  <title>Débora — Consultora de Amamentação</title>
  <style>
:root {
  --bg-deep:#160f0d;
  --bg:#241713;
  --bg-soft:#3a261f;
  --paper:#f2e7de;
  --paper-2:#fff9f4;
  --ink:#2b1b17;
  --accent:#c9754e;
  --accent-2:#e4a17d;
  --cream:#fff8f2;
  --muted:#d5c3b9;
  --line:rgba(255,255,255,.14);
  --focus:#f4c2a7;
  --display:Didot,"Bodoni 72",Baskerville,Georgia,"Times New Roman",serif;
  --sans:"Avenir Next",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --radius-card:24px;
  --shadow-card:0 18px 48px rgba(0,0,0,.16);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg-deep);scrollbar-color:rgba(228,161,125,.55) rgba(255,255,255,.06);scrollbar-width:auto}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
html::-webkit-scrollbar-thumb{background:rgba(228,161,125,.5);border:2px solid transparent;background-clip:padding-box;border-radius:999px}
html::-webkit-scrollbar-thumb:hover{background:rgba(228,161,125,.7);border:2px solid transparent;background-clip:padding-box}
body{margin:0;min-width:320px;background:var(--bg);color:var(--cream);font-family:var(--sans);line-height:1.45;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,a{font:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:4px}

.scene{position:fixed;inset:0;z-index:-10;overflow:hidden;background:linear-gradient(160deg,var(--bg-deep) 0%,var(--bg) 38%,var(--bg-soft) 72%,var(--bg-deep) 100%)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.24));pointer-events:none}
.scene__wash{position:absolute;border-radius:50%;filter:blur(90px);opacity:.26}
.scene__wash--one{width:55vw;height:55vw;left:-24vw;top:6vh;background:var(--accent)}
.scene__wash--two{width:62vw;height:62vw;right:-30vw;top:58vh;background:#714334;opacity:.3}
.scene__thread{position:absolute;width:82vw;height:82vw;right:-38vw;top:8vh;border:1px solid rgba(228,161,125,.34);border-radius:50%;transform:rotate(-8deg)}
.scene__thread::after{content:"";position:absolute;width:70vw;height:70vw;left:-92vw;top:115vh;border:1px solid rgba(228,161,125,.19);border-radius:50%}

.topbar{position:fixed;z-index:100;top:max(14px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.monogram{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);background:rgba(18,11,9,.48);backdrop-filter:blur(18px);font:500 1rem var(--display);letter-spacing:.02em}
.topbar__action{min-height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(18,11,9,.48);backdrop-filter:blur(18px);display:inline-flex;align-items:center;font-size:.8rem;font-weight:700}

.hero{min-height:94svh;padding:94px clamp(16px,5vw,72px) 26px;display:grid;align-items:center}
.hero__shell{width:min(1180px,100%);margin:0 auto;min-height:calc(94svh - 120px);display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,.78fr);grid-template-rows:1fr auto;gap:26px 54px;align-items:center}
.hero__copy{position:relative;z-index:2;max-width:670px;padding-top:18px}
.eyebrow{margin:0 0 18px;text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;font-weight:800;color:var(--accent-2)}
.hero h1{margin:0;font:400 clamp(5.4rem,10vw,9.8rem)/.78 var(--display);letter-spacing:-.07em}
.role{margin:22px 0 0;font-size:clamp(1rem,1.5vw,1.25rem);font-weight:600;color:var(--accent-2)}
.hero__lead{max-width:490px;margin:25px 0 0;font-size:clamp(1rem,1.35vw,1.15rem);color:var(--muted)}
.hero__actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.button{min-height:48px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:.84rem;font-weight:750;transition:transform .2s ease,background-color .2s ease,border-color .2s ease}
.button--solid{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.button--outline{background:rgba(255,255,255,.02);border:1px solid rgba(228,161,125,.48);color:var(--cream)}
@media (hover:hover){.button:hover,.mini-card:hover{transform:translateY(-2px)}.button--solid:hover{background:#d9855f}.button--outline:hover{border-color:var(--accent-2);background:rgba(255,255,255,.04)}}

.hero__portrait{height:min(690px,72svh);align-self:end;position:relative}
.portrait-card{position:absolute;inset:0;border-radius:56px 56px 28px 28px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#cfc8c2;box-shadow:0 32px 84px rgba(0,0,0,.26)}
.portrait-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,rgba(29,17,14,.20) 100%);pointer-events:none}
.portrait-card img{width:100%;height:100%;object-fit:cover;object-position:50% 34%}
.hero__note{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:18px;border-top:1px solid var(--line);font-size:.73rem;color:var(--muted)}
.hero__note a{text-transform:uppercase;letter-spacing:.08em;color:var(--cream)}

.shortcut-region{padding:20px 16px 12vh;position:relative}
.shortcut-shell{width:min(860px,100%);margin:0 auto}
.shortcut-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px;padding:0 4px}
.shortcut-heading span{font:400 1.45rem var(--display);letter-spacing:-.02em}
.shortcut-heading p{max-width:300px;margin:0;text-align:right;color:var(--muted);font-size:.76rem}
.mini-card-list{display:grid;gap:10px}
.mini-card{min-height:108px;border-radius:var(--radius-card);display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:18px;padding:16px 18px;border:1px solid transparent;box-shadow:var(--shadow-card);transition:transform .2s ease,border-color .2s ease,background-color .2s ease}
.mini-card--light{background:linear-gradient(145deg,var(--paper-2),var(--paper));color:var(--ink);border-color:rgba(43,27,23,.08)}
.mini-card--dark{background:linear-gradient(145deg,rgba(59,39,32,.98),rgba(31,20,16,.98));color:var(--cream);border-color:rgba(255,255,255,.10)}
.mini-card__icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.mini-card--light .mini-card__icon{background:rgba(201,117,78,.17);color:#9f5638}
.mini-card--dark .mini-card__icon{background:rgba(201,117,78,.28);color:#f5d6c5}
.mini-card__icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mini-card__copy{min-width:0}
.mini-card h2{margin:0;font:400 clamp(1.55rem,3.3vw,2.15rem)/1 var(--display);letter-spacing:-.035em}
.mini-card p{margin:7px 0 0;font-size:.78rem;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-card__action{min-height:42px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:750;border:1px solid currentColor;white-space:nowrap;transition:background-color .2s ease,color .2s ease}
.mini-card--light .mini-card__action{color:#a45d3f;border-color:rgba(164,93,63,.42)}
.mini-card--dark .mini-card__action{color:#efbea5;border-color:rgba(239,190,165,.38)}
@media (hover:hover){.mini-card__action:hover{background:var(--accent);border-color:var(--accent);color:white}}

.footer{width:min(860px,calc(100% - 32px));margin:0 auto 30px;padding:22px 4px max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;color:var(--muted);font-size:.74rem}
.footer strong{display:block;color:var(--cream);font:400 1.45rem var(--display)}
.footer span{display:block;margin-top:3px}
.footer__links{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.footer__links a{color:var(--cream)}

.hero-reveal{opacity:0;transform:translateY(18px);animation:heroIn .72s cubic-bezier(.2,.72,.2,1) forwards}
.hero-reveal--delay{animation-delay:.12s}
.hero-reveal--delay-2{animation-delay:.22s}
.mini-card{opacity:0;transform:translateY(14px);animation:cardIn .55s cubic-bezier(.2,.72,.2,1) forwards;animation-delay:calc(.28s + var(--i) * .055s)}
@keyframes heroIn{to{opacity:1;transform:none}}
@keyframes cardIn{to{opacity:1;transform:none}}

@media (max-width:760px){
  .topbar{left:12px;right:12px}.monogram{width:44px;height:44px}.topbar__action{min-height:42px;padding:0 15px}
  .hero{min-height:auto;padding:82px 12px 22px}
  .hero__shell{min-height:0;display:block}
  .hero__copy{padding:6px 8px 0;max-width:none;min-height:264px;position:relative;z-index:3}
  .eyebrow{font-size:.58rem;margin-bottom:12px;max-width:48%}
  .hero h1{font-size:clamp(4.8rem,22vw,7rem);line-height:.79;max-width:56%;position:relative;z-index:3}
  .role{font-size:.94rem;margin-top:14px;max-width:50%}
  .hero__lead{font-size:.86rem;line-height:1.45;margin-top:17px;max-width:48%}
  .hero__actions{gap:8px;margin-top:20px}.button{min-height:44px;padding:0 13px;border-radius:12px;font-size:.75rem}
  .hero__portrait{height:520px;margin-top:-264px;margin-left:34%;z-index:1}
  .portrait-card{border-radius:36px 36px 22px 22px}
  .portrait-card::before{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,rgba(22,15,13,.98) 0%,rgba(22,15,13,.68) 20%,transparent 52%);pointer-events:none}
  .portrait-card img{object-position:53% 30%}
  .hero__note{position:relative;z-index:4;margin:14px 8px 0;padding-top:14px;font-size:.65rem}
  .hero__note a{font-size:.61rem;text-align:right}
  .shortcut-region{padding:8px 12px 12vh}
  .shortcut-heading{margin:0 4px 12px}.shortcut-heading span{font-size:1.2rem}.shortcut-heading p{display:none}
  .mini-card-list{gap:8px}
  .mini-card{min-height:98px;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;padding:13px 13px;border-radius:21px}
  .mini-card__icon{width:50px;height:50px}.mini-card__icon svg{width:24px;height:24px}
  .mini-card h2{font-size:clamp(1.28rem,6vw,1.72rem)}
  .mini-card p{font-size:.69rem;margin-top:5px;max-width:48vw}
  .mini-card__action{min-height:40px;padding:0 10px;border-radius:11px;font-size:.67rem}
  .footer{width:calc(100% - 24px);grid-template-columns:1fr;margin-bottom:10px}.footer__links{justify-content:flex-start}
}

@media (max-width:430px){
  .hero__copy{min-height:250px}
  .hero h1{font-size:clamp(4.35rem,21.5vw,6.2rem)}
  .hero__portrait{height:485px;margin-top:-250px;margin-left:31%}
  .hero__lead{max-width:47%}.role{max-width:48%}
  .mini-card{min-height:94px;grid-template-columns:46px minmax(0,1fr) auto;padding:12px;gap:10px}
  .mini-card__icon{width:46px;height:46px}
  .mini-card p{max-width:43vw}
}

@media (max-width:370px){
  .hero__portrait{margin-left:28%}
  .mini-card{grid-template-columns:44px minmax(0,1fr)}
  .mini-card__action{grid-column:2;justify-self:start;min-height:36px;margin-top:-2px}
  .mini-card p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero-reveal,.mini-card{opacity:1;transform:none}
}

@media (forced-colors:active){
  .mini-card,.button,.monogram,.topbar__action{forced-color-adjust:auto}
}
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__wash scene__wash--one"></div>
    <div class="scene__wash scene__wash--two"></div>
    <div class="scene__thread"></div>
  </div>

  <header class="topbar">
    <a class="monogram" href="#inicio" aria-label="Ir para o início"><span id="brandInitials">D.</span></a>
    <a class="topbar__action" id="topbarAction" href="#agendar">Agendar</a>
  </header>

  <main>
    <section class="hero" id="inicio" aria-labelledby="heroName">
      <div class="hero__shell">
        <div class="hero__copy hero-reveal">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroName"></h1>
          <p class="role" id="heroRole"></p>
          <p class="hero__lead" id="heroLead"></p>
          <div class="hero__actions">
            <a class="button button--solid" id="heroPrimary" href="#agendar">Agendar</a>
            <a class="button button--outline" id="heroSecondary" href="#whatsapp">WhatsApp</a>
          </div>
        </div>

        <div class="hero__portrait hero-reveal hero-reveal--delay">
          <div class="portrait-card">
            <img id="heroImage" src="https://debora-lactacao.nutricionistaa760333.chatgpt.site/assets/debora-hero.jpeg" alt="Retrato profissional de Débora" />
          </div>
        </div>

        <div class="hero__note hero-reveal hero-reveal--delay-2">
          <span id="heroNote"></span>
          <a href="#atalhos">Conheça o atendimento <span aria-hidden="true">↓</span></a>
        </div>
      </div>
    </section>

    <section class="shortcut-region" id="atalhos" aria-label="Atalhos e serviços">
      <div class="shortcut-shell">
        <div class="shortcut-heading hero-reveal">
          <span>Escolha por onde começar</span>
          <p>Informações essenciais em poucos toques.</p>
        </div>
        <div class="mini-card-list" id="cardStack"></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="contato">
    <div>
      <strong id="footerName">Débora</strong>
      <span id="footerRole">Consultora de amamentação</span>
    </div>
    <nav class="footer__links" id="socialLinks" aria-label="Redes e contato"></nav>
  </footer>

  <script>
const baseProfile = {
  meta: {
    title: "Débora — Consultora de Amamentação",
    description: "Apoio individualizado, orientação e acompanhamento para uma jornada de amamentação mais leve e segura.",
    themeColor: "#160f0d"
  },
  theme: {
    bgDeep: "#160f0d",
    bg: "#241713",
    bgSoft: "#3a261f",
    paper: "#f2e7de",
    paper2: "#fff9f4",
    ink: "#2b1b17",
    accent: "#c9754e",
    accent2: "#e4a17d"
  },
  identity: {
    name: "Débora",
    initials: "D.",
    role: "Consultora de amamentação",
    portrait: "https://debora-lactacao.nutricionistaa760333.chatgpt.site/assets/debora-hero.jpeg"
  },
  hero: {
    eyebrow: "Cuidado · orientação · acompanhamento",
    lead: "Apoio individualizado para uma jornada mais leve, segura e confiante.",
    note: "Atendimento online e presencial",
    primaryLabel: "Agendar",
    primaryHref: "#contato",
    secondaryLabel: "WhatsApp",
    secondaryHref: "#contato"
  },
  cards: [
    {
      type: "contact",
      theme: "light",
      title: "Fale comigo",
      description: "Um primeiro contato simples e acolhedor.",
      actionLabel: "WhatsApp",
      actionHref: "#contato"
    },
    {
      type: "services",
      theme: "dark",
      title: "Meus serviços",
      description: "Conheça as formas de acompanhamento disponíveis.",
      actionLabel: "Saiba mais",
      actionHref: "#contato"
    },
    {
      type: "calendar",
      theme: "light",
      title: "Atendimento online",
      description: "Orientação individualizada com praticidade e conforto.",
      actionLabel: "Agendar",
      actionHref: "#contato"
    },
    {
      type: "prep",
      theme: "dark",
      title: "Preparação para amamentação",
      description: "Informação e planejamento para começar com mais confiança.",
      actionLabel: "Ver detalhes",
      actionHref: "#contato"
    },
    {
      type: "materials",
      theme: "light",
      title: "Materiais e orientações",
      description: "Conteúdos práticos para consultar quando precisar.",
      actionLabel: "Acessar",
      actionHref: "#contato"
    },
    {
      type: "testimonials",
      theme: "dark",
      title: "Depoimentos",
      description: "Experiências de quem já passou pelo acompanhamento.",
      actionLabel: "Conhecer",
      actionHref: "#contato"
    }
  ],
  socials: [
    ["Instagram", "#contato"],
    ["WhatsApp", "#contato"],
    ["E-mail", "mailto:contato@deboralactacao.com.br"],
    ["Área profissional", "/"]
  ]
};

const STORAGE_KEY = 'personalSiteProfileV3';
let profile = structuredClone(baseProfile);
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) profile = deepMerge(profile, JSON.parse(saved));
} catch (_) {}

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (ch) => ({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
}[ch]));

function deepMerge(target, source) {
  for (const [key, value] of Object.entries(source || {})) {
    if (value && typeof value === 'object' && !Array.isArray(value) && target[key] && typeof target[key] === 'object' && !Array.isArray(target[key])) {
      deepMerge(target[key], value);
    } else {
      target[key] = value;
    }
  }
  return target;
}

function setVar(name, value) {
  if (value) document.documentElement.style.setProperty(name, value);
}

function applyTheme(theme = {}) {
  setVar('--bg-deep', theme.bgDeep);
  setVar('--bg', theme.bg);
  setVar('--bg-soft', theme.bgSoft);
  setVar('--paper', theme.paper);
  setVar('--paper-2', theme.paper2);
  setVar('--ink', theme.ink);
  setVar('--accent', theme.accent);
  setVar('--accent-2', theme.accent2);
}

function iconFor(type) {
  const icons = {
    contact: '<path d="M7 20l-3 1 1-3a8 8 0 1 1 2 2Z"/><path d="M8.5 9.5c1.2 3 2.5 4.3 5.5 5.5"/><path d="M9 8l-1.4 1.6M16 15l-1.6 1.4"/>',
    services: '<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/><path d="M12 5V3"/>',
    calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>',
    prep: '<path d="M12 21V11"/><path d="M12 14c-4 0-7-2.5-7-6 4 0 7 2 7 6Z"/><path d="M12 11c3.8 0 6-2.2 6-5-3.8 0-6 1.8-6 5Z"/>',
    materials: '<path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H12v18H7.5A3.5 3.5 0 0 0 4 23.5Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H12v18h4.5a3.5 3.5 0 0 1 3.5 3.5Z"/>',
    testimonials: '<path d="M6 17.5 3 21l1-5a8 8 0 1 1 2 1.5Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'
  };
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[type] || icons.services}</svg>`;
}

function cardMarkup(card, index) {
  return `<article class="mini-card mini-card--${esc(card.theme || 'dark')}" style="--i:${index}">
    <div class="mini-card__icon">${iconFor(card.type)}</div>
    <div class="mini-card__copy">
      <h2>${esc(card.title)}</h2>
      <p>${esc(card.description)}</p>
    </div>
    <a class="mini-card__action" href="${esc(card.actionHref || '#')}">${esc(card.actionLabel || 'Abrir')}</a>
  </article>`;
}

function render() {
  document.title = profile.meta?.title || 'Débora — Consultora de Amamentação';
  const metaDescription = document.querySelector('meta[name="description"]');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaDescription) metaDescription.content = profile.meta?.description || '';
  if (metaTheme) metaTheme.content = profile.meta?.themeColor || profile.theme?.bgDeep || '#160f0d';

  applyTheme(profile.theme);
  $('brandInitials').textContent = profile.identity.initials;
  $('heroEyebrow').textContent = profile.hero.eyebrow;
  $('heroName').textContent = profile.identity.name;
  $('heroRole').textContent = profile.identity.role;
  $('heroLead').textContent = profile.hero.lead;
  $('heroNote').textContent = profile.hero.note;
  $('heroImage').src = profile.identity.portrait;
  $('heroImage').alt = `Retrato profissional de ${profile.identity.name}`;

  $('heroPrimary').textContent = profile.hero.primaryLabel;
  $('heroPrimary').href = profile.hero.primaryHref;
  $('heroSecondary').textContent = profile.hero.secondaryLabel;
  $('heroSecondary').href = profile.hero.secondaryHref;
  $('topbarAction').textContent = profile.hero.primaryLabel;
  $('topbarAction').href = profile.hero.primaryHref;

  $('cardStack').innerHTML = (profile.cards || []).map(cardMarkup).join('');
  $('footerName').textContent = profile.identity.name;
  $('footerRole').textContent = profile.identity.role;
  $('socialLinks').innerHTML = (profile.socials || []).map(([label, href]) => `<a href="${esc(href)}">${esc(label)}</a>`).join('');
}

render();
  </script>
</body>
</html>
