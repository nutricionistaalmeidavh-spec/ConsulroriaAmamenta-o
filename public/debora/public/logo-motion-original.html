<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo — scroll fiel</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fffaf7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#332b36}
body{min-height:100vh;overscroll-behavior-y:none}
.scroll{height:340svh;position:relative}
.stage{position:sticky;top:0;height:100svh;min-height:560px;overflow:hidden;display:grid;place-items:center}
.glow{
  position:absolute;width:min(110vw,680px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(226,184,244,.28),rgba(250,189,216,.12) 45%,transparent 72%);
  filter:blur(22px);
  transform:scale(var(--gscale,.72));
  opacity:var(--gopacity,.16);
}
.logo{
  position:relative;
  width:min(78vw,460px);
  aspect-ratio:1060/1035;
  transform:translateY(var(--ly,16px)) scale(var(--ls,.94));
  filter:drop-shadow(0 24px 34px rgba(104,70,112,.16));
  will-change:transform;
}
.card{
  position:absolute;inset:0;border-radius:18%;
  overflow:hidden;
  opacity:var(--co,0);
  transform:scale(var(--cs,.92));
  transform-origin:center;
  background:
    radial-gradient(circle at 82% 18%,rgba(244,179,205,.92),transparent 40%),
    radial-gradient(circle at 18% 80%,rgba(180,166,235,.95),transparent 48%),
    linear-gradient(135deg,#c8afe8 0%,#d9acd9 52%,#efacc7 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.20),
    inset 0 8px 24px rgba(255,255,255,.10);
  will-change:opacity,transform;
}
.piece{
  position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
  pointer-events:none;user-select:none;
  will-change:opacity,transform,clip-path;
}
.mother{
  opacity:var(--mo,0);
  transform:translate(var(--mx,-26px),var(--my,32px)) scale(var(--ms,.96));
  clip-path:inset(var(--mclip,100%) 0 0 0);
}
.baby{
  opacity:var(--bo,0);
  transform:translate(var(--bx,48px),var(--by,52px)) scale(var(--bs,.76));
  transform-origin:54% 69%;
}
.heart{
  opacity:var(--ho,0);
  transform:translateY(var(--hy,12px)) scale(var(--hs,.72));
  transform-origin:70% 31%;
}
.shine{
  position:absolute;inset:-40%;
  background:linear-gradient(112deg,transparent 39%,rgba(255,255,255,.25) 49%,transparent 59%);
  transform:translateX(var(--shx,-72%)) rotate(8deg);
  opacity:var(--sho,0);
  pointer-events:none;
  mix-blend-mode:screen;
}
.hint{
  display:none;
  position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;
  background:rgba(255,255,255,.74);backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(70,50,80,.08);font-size:13px;white-space:nowrap
}
.arrow{font-size:22px;line-height:1;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px)}}
.progress{display:none}
.progress i{display:block;width:100%;height:100%;background:rgba(70,50,80,.34);transform-origin:top;transform:scaleY(var(--p,0))}
.end{height:42svh;display:grid;place-items:center;padding:30px;text-align:center;font-size:18px;opacity:.58}
</style>
</head>
<body>
<section class="scroll" id="scroll">
  <div class="stage">
    <div class="glow"></div>

    <div class="logo">
      <div class="card"></div>

<div class="end">Fim da demonstração — volte o scroll para desfazer.</div>

<script>
const root=document.documentElement;
const sec=document.getElementById('scroll');
const hint=document.getElementById('hintText');

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const range=(p,a,b)=>clamp((p-a)/(b-a));
const ease=t=>1-Math.pow(1-t,3);
const mix=(a,b,t)=>a+(b-a)*t;
const set=(k,v)=>root.style.setProperty(k,v);

function render(){
  const rect=sec.getBoundingClientRect();
  const max=sec.offsetHeight-innerHeight;
  const p=clamp(-rect.top/max);

  // 1) O card aparece PRIMEIRO, sempre reto.
  const card=ease(range(p,0.00,0.17));

  // 2) Só depois de o card já estar perceptível começa a arte interna.
  const mother=ease(range(p,0.13,0.39));
  const baby=ease(range(p,0.34,0.60));
  const heart=ease(range(p,0.56,0.79));
  const finish=ease(range(p,0.80,1.00));

  set('--p',p.toFixed(4));

  set('--co',card.toFixed(3));
  set('--cs',mix(.92,1,card).toFixed(3));

  set('--mo',mother.toFixed(3));
  set('--mx',mix(-26,0,mother).toFixed(1)+'px');
  set('--my',mix(32,0,mother).toFixed(1)+'px');
  set('--ms',mix(.96,1,mother).toFixed(3));
  set('--mclip',mix(100,0,mother).toFixed(1)+'%');

  set('--bo',baby.toFixed(3));
  set('--bx',mix(48,0,baby).toFixed(1)+'px');
  set('--by',mix(52,0,baby).toFixed(1)+'px');
  set('--bs',mix(.76,1,baby).toFixed(3));

  const pulse=heart>.89 ? Math.sin((heart-.89)/.11*Math.PI)*.08 : 0;
  set('--ho',heart.toFixed(3));
  set('--hy',mix(12,0,heart).toFixed(1)+'px');
  set('--hs',(mix(.72,1,heart)+pulse).toFixed(3));

  set('--ly',mix(16,-2,finish).toFixed(1)+'px');
  set('--ls',mix(.94,1,finish).toFixed(3));
  set('--gscale',mix(.72,1.05,finish).toFixed(3));
  set('--gopacity',mix(.16,.48,finish).toFixed(3));
  set('--sho',finish.toFixed(3));
  set('--shx',mix(-72,72,finish).toFixed(1)+'%');

  hint.textContent =
    p < .06 ? 'role para começar' :
    p < .20 ? 'o card aparece' :
    p < .43 ? 'a mãe se forma' :
    p < .64 ? 'o bebê entra' :
    p < .82 ? 'o coração completa' :
              'símbolo completo';
}

addEventListener('scroll',render,{passive:true});
addEventListener('resize',render);
requestAnimationFrame(render);
</script>
